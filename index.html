<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clayton Banks — I build AI products</title>
    <meta name="description" content="Clayton Banks is a full-stack developer in Harare, Zimbabwe, building AI products people use: an offline AI agent, an AI farming advisor, and a hackathon-winning opportunity app for young Zimbabweans." />
    <link rel="canonical" href="https://clayton-portfolio-three.vercel.app/" />
    <meta name="theme-color" content="#e3e9f5" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clayton-portfolio-three.vercel.app/" />
    <meta property="og:title" content="Clayton Banks — I build AI products" />
    <meta property="og:description" content="Full-stack developer in Harare building AI products: SABINE, Ask Simon, Pathway and more." />
    <meta property="og:image" content="https://clayton-portfolio-three.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint to avoid a flash. Mirrors src/core/theme.ts.
      try {
        var t = localStorage.getItem('cb-theme')
        if (t !== 'light' && t !== 'night') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
      document.documentElement.classList.add('js')
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Clayton Banks",
        "url": "https://clayton-portfolio-three.vercel.app/",
        "jobTitle": "Full-stack developer",
        "homeLocation": { "@type": "Place", "name": "Harare, Zimbabwe" },
        "sameAs": ["https://github.com/ClaytonHax"]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#work">Skip to projects</a>

    <!-- Background gradient blobs. Owner: sections (src/sections/background.ts). -->
    <div id="bg" aria-hidden="true"></div>

    <!-- Floating glass nav. Owner: sections. -->
    <header id="nav"></header>

    <main id="main">
      <!-- The whole line (intro handwriting + scroll-driven path) is drawn into this layer,
           which spans the full height of <main>. Owner: pen (src/pen). -->
      <div id="pen-layer" aria-hidden="true"></div>

      <section id="intro" data-section="intro" aria-labelledby="intro-title">
        <h1 id="intro-title" class="sr-only">Clayton Banks — I build AI products</h1>
        <!-- Owner: pen. Reserved area the intro handwriting is laid out inside. -->
        <div id="intro-stage" aria-hidden="true"></div>
        <!-- Owner: sections. Role line, location, scroll cue, shown after intro:done. -->
        <div id="intro-meta"></div>
      </section>

      <!-- Owner: sections. Each renders its content and places data-pen-stop anchors. -->
      <section id="about" data-section="about" aria-labelledby="about-title"></section>
      <section id="work" data-section="work" aria-labelledby="work-title"></section>
      <section id="more" data-section="more" aria-labelledby="more-title"></section>
      <section id="stack" data-section="stack" aria-labelledby="stack-title"></section>
      <section id="contact" data-section="contact" aria-labelledby="contact-title"></section>
    </main>

    <footer id="footer"></footer>

    <!-- Pen tip glow + ink flecks. Fixed to the viewport. Owner: pen. -->
    <canvas id="ink" aria-hidden="true"></canvas>

    <!-- Case study dialog. Owner: case (src/case). -->
    <div id="case-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
